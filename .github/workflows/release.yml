name: Release

# 发布：打 v* tag 时触发（如 git tag -a v0.0.4 -m "..." && git push origin v0.0.4）。
# 构建 6 平台二进制并创建 GitHub Release；tag 上再次跑测试作为最终校验。
on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - os: windows-latest
            target: windows-arm64
            goos: windows
            goarch: arm64
            ext: .exe
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - os: macos-latest
            target: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o cline-proxy-${{ matrix.target }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-proxy-${{ matrix.target }}
          path: cline-proxy-${{ matrix.target }}${{ matrix.ext }}

  # tag 上的最终测试校验：防止 tag 指向未验证提交。
  # -race 需要 cgo + 真内核（本地 Android proot 的 ThreadSanitizer 不可用）。
  test:
    name: Test (vet / unit / race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race detector
        run: go test -race ./... -count=1

  release:
    name: Create Release
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cline-proxy-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/cline-proxy-*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
